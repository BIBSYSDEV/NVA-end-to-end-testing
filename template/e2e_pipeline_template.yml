AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'

Description: >
  Pipeline for api testing and e2e testing

Parameters:
  GitHubOAuthToken:
    Description: OAuth token used by AWS CodePipeline to connect to GitHub
    NoEcho: true
    Type: String
    Default: '{{resolve:secretsmanager:githubtoken:SecretString}}'
  GitHubOwner:
    Description: GitHub username owning the repo
    Type: String
    Default: BIBSYSDEV
  ApiTestGitHubRepo:
    Description: Api test GitHub repo name
    Type: String
    Default: nva-api-integration-test
  ApiTestGitHubBranch:
    Description: Api test GitHub repo branch name. It defaults to main if not specified.
    Type: String
    Default: main
  E2EGitHubRepo:
    Description: GitHub repo name
    Type: String
    Default: NVA-end-to-end-testing
  E2EGitHubBranch:
    Description: GitHub repo branch name. It defaults to main if not specified.
    Type: String
    Default: test-deploy
  CypressBaseUrl:
    Description: Base url for application under testing
    Type: String
    Default: https://e2e.nva.aws.unit.no/
Resources:
  E2ETestReportBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      BucketName: !Sub 'nva-testreport2-${AWS::AccountId}'
      WebsiteConfiguration:
        IndexDocument: cucumber_report.html
        ErrorDocument: cucumber_report.html
  E2ETestReportBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref E2ETestReportBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${E2ETestReportBucket.Arn}/*'
  ApiTestReportBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      BucketName: !Sub 'nva-api-test-report-${AWS::AccountId}'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      LifecycleConfiguration:
        Rules:
          - Id: expire-reports-after-30-days
            Status: Enabled
            ExpirationInDays: 30
            Filter:
              Prefix: ''
  ApiTestReportBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref ApiTestReportBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${ApiTestReportBucket.Arn}/*'
  CodeBuildTestDataProject:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: S3_BUCKET
            Type: PLAINTEXT
            Value: !Ref ArtifactStoreBucket
          - Name: ROLE_ARN
            Type: PLAINTEXT
            Value: !GetAtt TestrunnerRole.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: template/buildspec.testdata.yml
  CodeBuildApiTestingProject:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: TESTREPORTS_BUCKET
            Type: PLAINTEXT
            Value: !Ref ApiTestReportBucket
          - Name: S3_BUCKET
            Type: PLAINTEXT
            Value: !Ref ArtifactStoreBucket
          - Name: ROLE_ARN
            Type: PLAINTEXT
            Value: !GetAtt TestrunnerRole.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yaml
  CodeBuildE2ETestingProject:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      BuildBatchConfig:
        CombineArtifacts: false
        ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: TESTREPORTS_BUCKET
            Type: PLAINTEXT
            Value: !Ref E2ETestReportBucket
          - Name: S3_BUCKET
            Type: PLAINTEXT
            Value: !Ref ArtifactStoreBucket
          - Name: CYPRESS_REMOTE
            Type: PLAINTEXT
            Value: remote
          - Name: ROLE_ARN
            Type: PLAINTEXT
            Value: !GetAtt TestrunnerRole.Arn
          - Name: CYPRESS_baseUrl
            Type: PLAINTEXT
            Value: !Ref CypressBaseUrl
      Source:
        Type: CODEPIPELINE
        BuildSpec: template/buildspec.test_parallel.yml
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      ArtifactStore:
        Type: S3
        Location:
          Ref: ArtifactStoreBucket
      RoleArn: !GetAtt PipelineRole.Arn
      Stages:
        - Name: Source
          Actions:
            - Name: ApiTestGitHubSource
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: '1'
              Configuration:
                Owner: !Ref GitHubOwner
                OAuthToken: !Ref GitHubOAuthToken
                Repo: !Ref ApiTestGitHubRepo
                Branch: !Ref ApiTestGitHubBranch
                PollForSourceChanges: true
              OutputArtifacts:
                - Name: ApiTestSourceArtifact
              RunOrder: 1
            - Name: E2EGitHubSource
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: '1'
              Configuration:
                Owner: !Ref GitHubOwner
                OAuthToken: !Ref GitHubOAuthToken
                Repo: !Ref E2EGitHubRepo
                Branch: !Ref E2EGitHubBranch
                PollForSourceChanges: true
              OutputArtifacts:
                - Name: E2ESourceArtifact
              RunOrder: 1
        - Name: E2ETestDataCreation
          Actions:
            - Name: E2ETestDataCreation
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !GetAtt CodeBuildTestDataProject.Arn
              InputArtifacts:
                - Name: E2ESourceArtifact
              OutputArtifacts:
                - Name: TestDataArtifact
              RunOrder: 1
        - Name: ApiTesting
          Actions:
            - Name: ApiTesting
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !GetAtt CodeBuildApiTestingProject.Arn
              InputArtifacts:
                - Name: ApiTestSourceArtifact
              RunOrder: 1
        - Name: E2ETesting
          Actions:
            - Name: E2ETesting
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !GetAtt CodeBuildE2ETestingProject.Arn
                BatchEnabled: true
              InputArtifacts:
                - Name: E2ESourceArtifact
              RunOrder: 1

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: ['sts:AssumeRole']
            Effect: Allow
            Principal:
              Service: [codepipeline.amazonaws.com]
        Version: '2012-10-17'
      Path: /
      Policies:
        - PolicyName: CodePipelineAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - 's3:ListBucket'
                  - 's3:GetBucketVersioning'
                  - 's3:PutObject'
                  - 's3:GetObject'
                  - 's3:GetObjectVersion'
                Effect: Allow
                Resource:
                  - !Sub ${ArtifactStoreBucket.Arn}/*
              - Action:
                  - 'codebuild:StartBuild'
                  - 'codebuild:StartBuildBatch'
                  - 'codebuild:BatchGetBuilds'
                  - 'codebuild:BatchGetBuildBatches'
                Effect: Allow
                Resource:
                  - !GetAtt CodeBuildTestDataProject.Arn
                  - !GetAtt CodeBuildE2ETestingProject.Arn
                  - !GetAtt CodeBuildApiTestingProject.Arn
              - Action:
                  - 'ssm:GetParameter'
                  - 'ssm:GetParameters'
                Effect: Allow
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'lambda:InvokeFunction'
                Resource: '*'

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action:
              - 'sts:AssumeRole'
            Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
      Path: /
      Policies:
        - PolicyName: CodeBuildLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*:*'
        - PolicyName: BucketPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:ListBucket'
                Resource:
                  - !GetAtt ArtifactStoreBucket.Arn
                  - !GetAtt E2ETestReportBucket.Arn
                  - !GetAtt ApiTestReportBucket.Arn
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:GetObjectVersion'
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                Resource:
                  - !Sub '${ArtifactStoreBucket.Arn}/*'
                  - !Sub '${E2ETestReportBucket.Arn}/*'
                  - !Sub '${ApiTestReportBucket.Arn}/*'
        - PolicyName: secretsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ssm:GetParameters'
                  - 'secretsmanager:GetSecretValue'
                Resource: 
                  - !Sub 'arn:aws:secretsmanager:eu-west-1:${AWS::AccountId}:secret:E2ECypressDashboardKey-nwJlda'
                  - !Sub 'arn:aws:secretsmanager:eu-west-1:${AWS::AccountId}:secret:backendClientSecret-hXGNg1'
                  - !Sub 'arn:aws:secretsmanager:eu-west-1:${AWS::AccountId}:secret:TestUserPassword-vGQcUm'
                  - !Sub 'arn:aws:secretsmanager:eu-west-1:${AWS::AccountId}:secret:E2ETesting-62EqP9'
                  - !Sub 'arn:aws:ssm:eu-west-1:${AWS::AccountId}:parameter/CognitoUserPoolId'
                  - !Sub 'arn:aws:ssm:eu-west-1:${AWS::AccountId}:parameter/NVA/ApplicationDomain'
                  - !Sub 'arn:aws:ssm:eu-west-1:${AWS::AccountId}:parameter/test/CognitoTestClient1'
                  - !Sub 'arn:aws:ssm:eu-west-1:${AWS::AccountId}:parameter/NVA/ApiDomain'
                  - !Sub 'arn:aws:ssm:eu-west-1:${AWS::AccountId}:parameter/NVA/CognitoUri'
        - PolicyName: searchIndexLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'lambda:InvokeFunction'
                Resource:
                  - !Sub 'arn:aws:lambda:eu-west-1:${AWS::AccountId}:function:master-pipelines-NvaSearchApiClientPip-InitHandler-LEwtReql7EUp'
                  - !Sub 'arn:aws:lambda:eu-west-1:${AWS::AccountId}:function:master-pipelines-NvaSearchApi-DeleteIndicesHandler-EKKiXwO7Iu8y'
        - PolicyName: e2eTest
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'cognito-idp:AdminGetUser'
                  - 'cognito-idp:AdminDeleteUser'
                  - 'cognito-idp:AdminSetUserPassword'
                  - 'cognito-idp:AdminInitiateAuth'
                  - 'cognito-idp:AdminCreateUser'
                  - 'cognito-idp:ListUsers'
                Resource:
                  - '*'
              - Effect: Allow
                Action:
                  - 'sts:AssumeRole'
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/e2e-testing-CodeBuildServiceRole-YJMJ03VHJ0CB'
              - Effect: Allow
                Action:
                  - 'ssm:GetParameter'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'secretsmanager:GetSecretValue'
                  - 'secretsmanager:GetResourcePolicy'
                  - 'secretsmanager:DescribeSecret'
                  - 'secretsmanager:ListSecretVersionIds'
                Resource: !Sub 'arn:aws:secretsmanager:eu-west-1:${AWS::AccountId}:secret:E2ECypressDashboardKey-nwJlda'
              - Effect: Allow
                Action:
                  - 'dynamodb:Scan'
                  - 'dynamodb:Query'
                  - 'dynamodb:PutItem'
                  - 'dynamodb:DeleteItem'
                  - 'dynamodb:BatchWriteItem' 
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'codebuild:StartBuild'
                  - 'codebuild:StartBuildBatch'
                  - 'codebuild:BatchGetBuildBatches'
                  - 'codebuild:StopBuild'
                  - 'codebuild:RetryBuild'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'lambda:InvokeFunction'
                Resource: '*'

  TestrunnerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action:
              - 'sts:AssumeRole'
            Effect: Allow
            Principal:
              AWS: !GetAtt CodeBuildServiceRole.Arn
      Path: /
      Policies:
        - PolicyName: CodeBuildCognito
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'cognito-idp:AdminGetUser'
                  - 'cognito-idp:AdminDeleteUser'
                  - 'cognito-idp:AdminSetUserPassword'
                  - 'cognito-idp:AdminInitiateAuth'
                  - 'cognito-idp:AdminCreateUser'
                  - 'cognito-idp:ListUsers'
                Resource: '*'
        - PolicyName: secretsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ssm:GetParameters'
                  - 'secretsmanager:GetSecretValue'
                Resource: '*'

  ArtifactStoreBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
