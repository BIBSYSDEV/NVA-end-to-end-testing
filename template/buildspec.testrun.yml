version: 0.2

# Buildspec for running E2E tests in parallel. Test data is generated by buildspec.testdata.yml. Testreports are collected in
# a S3 bucket.

env:
  parameter-store:
    CYPRESS_AWS_USER_POOL_ID: CognitoUserPoolId
    CYPRESS_AWS_CLIENT_ID: /test/CognitoTestClient1
    CYPRESS_REACT_APP_URL: /NVA/ApplicationDomain
    CYPRESS_REACT_APP_API_HOST: /NVA/ApiDomain
    CYPRESS_COGNITO_URI: /NVA/CognitoUri
  secrets-manager:
    CYPRESS_DASHBOARD_KEY: 'E2ETesting:CypressDashboardKey'
    CYPRESS_DEVUSER: 'E2ETesting:DevUser'
    CYPRESS_DEVPASSWORD: 'E2ETesting:DevPassword'

phases:
  install:
    runtime-versions:
      nodejs: 24
  pre_build:
    commands:
      - node -v
      - npm ci --ignore-scripts --no-audit --no-fund
      - aws sts assume-role --role-arn $ROLE_ARN --role-session-name test > Credentials
      - export CYPRESS_AWS_ACCESS_KEY_ID=$(cat Credentials | jq -r '.Credentials.AccessKeyId')
      - export CYPRESS_AWS_SECRET_ACCESS_KEY=$(cat Credentials | jq -r '.Credentials.SecretAccessKey')
      - export CYPRESS_AWS_SESSION_TOKEN=$(cat Credentials | jq -r '.Credentials.SessionToken')
      - export CYPRESS_AWS_REGION=${AWS_REGION}
  build:
    commands:
      - npx cypress run --browser chrome  --record --key $CYPRESS_DASHBOARD_KEY --parallel --ci-build-id $CODEBUILD_INITIATOR --env messagesOutput=messages/cucumber-messages-$RUNNER.ndjson
  post_build:
    commands:
      - if [ -d "messages" ]; then aws s3 cp messages s3://$TESTREPORTS_BUCKET/messages --recursive; fi
artifacts:
  files:
    - '**/*'
